<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="horizonGrad" x1="4" y1="24" x2="44" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#5B5FEF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="24" cy="24" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B5FEF"/>
      <stop offset="100%" stop-color="#3B3FB6"/>
    </radialGradient>
  </defs>
  <!-- Background curved squircle -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#EEF0FF" />
  <!-- Sun setting / rising on horizon -->
  <path d="M14 24 A10 10 0 0 1 34 24 Z" fill="url(#sunGrad)"/>
  <!-- Horizon Line -->
  <line x1="8" y1="27" x2="40" y2="27" stroke="url(#horizonGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Pulse dot on the line -->
  <circle cx="24" cy="27" r="3.5" fill="#F97316"/>
  <!-- Sun rays -->
  <line x1="24" y1="8" x2="24" y2="11" stroke="#5B5FEF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="13.5" y1="13.5" x2="15.8" y2="15.8" stroke="#5B5FEF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="34.5" y1="13.5" x2="32.2" y2="15.8" stroke="#5B5FEF" stroke-width="2.5" stroke-linecap="round"/>
</svg>
